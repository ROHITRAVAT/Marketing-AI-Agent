[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
pythonpath = .

markers =
    integration: Integration tests that test component interaction
    e2e: End-to-end tests that test the full system
    slow: Tests that take a long time to run
    requires_pg: Tests that require PostgreSQL (skip if unavailable)
    security: Security and authorization tests
    publishing: Social media publishing tests
    scheduler: Scheduler service tests
    analytics: Analytics collection and reporting tests
    oauth: OAuth token management tests
    approval: Approval workflow tests
    critical: Critical business rule tests