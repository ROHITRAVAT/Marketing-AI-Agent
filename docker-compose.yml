services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP
      - "6334:6334"  # gRPC
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # qdrant image has no curl/wget/python — use a pure bash /dev/tcp probe
      # (Qdrant opens port 6333 only after storage init completes).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      # Keep Ollama reachable from this host for local verification, without
      # publishing its model-management API to the LAN/public interfaces.
      - "127.0.0.1:11430:11434"  # Changed host port to 11430 due to native Ollama running on 11434 and Windows port exclusion on 11435-11534
    environment:
      # Bind inside the container on all interfaces so Ollama is reachable from
      # the host (localhost:11434) AND from other containers (backend) via the
      # app-network. NOTE: this is the container bind address. It is unrelated
      # to the backend-facing OLLAMA_HOST value read from .env, which is the
      # Docker service name ("ollama").
      OLLAMA_HOST: 0.0.0.0
    volumes:
      # Persistent model storage — models are NEVER stored only inside the
      # container filesystem (which is lost on container recreation).
      - ollama_models:/root/.ollama
    healthcheck:
      # Use the bundled CLI rather than assuming curl exists in the image.
      # `ollama list` verifies that the local API server is accepting requests.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    # ── GPU acceleration (OFF by default — CPU-compatible) ──────────────────────
    # This host has no NVIDIA driver / NVIDIA Container Toolkit, so GPU support
    # is intentionally NOT enabled. To enable it later on a GPU host:
    #   1. Install the NVIDIA Container Toolkit and its Docker runtime.
    #   2. Uncomment the block below.
    #   3. Run `docker compose up -d`.
    #
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  # Single shared Docker network for all services — inter-service DNS by service
  # name (backend -> http://ollama:11434, http://qdrant:6333, postgres:5432).
  app-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_storage:
  # Ollama model storage — mounted at /root/.ollama inside the container.
  ollama_models:
