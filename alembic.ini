[alembic]
# Path to migration scripts
script_location = alembic

# Add the project root to sys.path so env.py can import the `app` package.
# Without this, `alembic` fails with "ModuleNotFoundError: No module named 'app'".
prepend_sys_path = .

file_template = %%(rev)s_%%(slug)s

# Timezone is intentionally not configured.

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S