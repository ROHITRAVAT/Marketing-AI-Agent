name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: marketing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx
        
    - name: Run Unit Tests
      env:
        TEST_PG_AVAILABLE: 'false'
        DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      run: |
        pytest tests/ -m "not integration and not e2e" -v
        
    - name: Run Integration Tests
      env:
        TEST_PG_AVAILABLE: 'true'
        TEST_DATABASE_URL: 'postgresql+asyncpg://test:test@localhost:5432/marketing_test'
      run: |
        pytest tests/integration/ -v --cov=app --cov-report=xml
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
